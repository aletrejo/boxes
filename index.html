<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boxes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Scope+One&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      /* Background setup with clear image and light fallback */
      background: linear-gradient(rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.25)),
                  url('images/background.png') no-repeat center center / cover;
      background-color: #f7f6f4;
      padding: 2rem;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    /* Elegant frosted background card */
    .content-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3.5rem 3rem;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(0, 0, 0, 0.03);
    }

    h1 {
      font-family: 'Scope One', serif;
      font-size: clamp(2.75rem, 6.5vw, 4.5rem);
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      color: #111111;
      line-height: 1.1;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.75;
      color: #333333;
      margin-bottom: 2.5rem;
      font-weight: 300;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.5rem;
      border: 1px solid #111111;
      color: #ffffff;
      background-color: #111111;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.25s ease;
      border-radius: 2px;
    }

    .btn:hover {
      background-color: transparent;
      color: #111111;
    }

    @media (max-width: 600px) {
      .content-card {
        padding: 2.25rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="content-card">
      <h1>Boxes</h1>
      <p>Through this project I wanted to document how conflicted I feel about living in the US at a time where I feel like I'm not welcome here.</p>
      <a href="gallery.html" class="btn">Enter</a>
    </div>
  </main>

</body>
</html>
